# ============================================================================
# Deploy to GitHub Pages
# Builds dist/index.html on GitHub's servers (so .env never needs to be in
# Git) using repository secrets, then publishes it to GitHub Pages.
# Runs on every push to main, or manually from the Actions tab.
# ============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        run: npm run build
        env:
          SCHOOL_EMAIL: ${{ secrets.SCHOOL_EMAIL }}
          SCHOOL_INSTAGRAM: ${{ secrets.SCHOOL_INSTAGRAM }}
          SCHOOL_WHATSAPP_RELAY: ${{ secrets.SCHOOL_WHATSAPP_RELAY }}
          SCHOOL_WHATSAPP_CHAT: ${{ secrets.SCHOOL_WHATSAPP_CHAT }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
